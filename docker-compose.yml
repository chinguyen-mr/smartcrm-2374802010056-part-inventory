# ==============================================================================
# SMART CRM — DOCKER COMPOSE (STACK SE)
# Phân hệ: L5 — Quản lý kho linh kiện thay thế (Mekong Mobile)
#
# Chạy từ thư mục trống chỉ với 2 lệnh:
#   cp .env.example .env
#   docker compose up -d --build
#
# Thứ tự khởi động: postgres (healthy) -> db-init (tạo schema + seed, rồi thoát 0)
#                   -> backend (healthy) -> frontend (healthy)
# ==============================================================================

x-backend-image: &backend-build
  context: .
  dockerfile: src/backend/Dockerfile

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-smart_crm}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD chua dat - chay: cp .env.example .env}

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 — KHÔNG publish cổng ra máy host (chỉ truy cập trong mạng compose)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_crm}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD chua dat - chay: cp .env.example .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartcrm_network

  # ----------------------------------------------------------------------------
  # 2. db-init — tạo schema nếu chưa có + seed idempotent, chạy xong thì thoát
  #    Chạy lại lần hai: docker compose run --rm db-init  (số dòng không đổi)
  # ----------------------------------------------------------------------------
  db-init:
    build: *backend-build
    image: smartcrm-backend:1.0
    command: ["node", "scripts/bootstrap.js"]
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - smartcrm_network

  # ----------------------------------------------------------------------------
  # 3. Backend Node.js 20 / Express
  # ----------------------------------------------------------------------------
  backend:
    build: *backend-build
    image: smartcrm-backend:1.0
    restart: unless-stopped
    environment:
      <<: *db-env
      NODE_ENV: production
      APP_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chua dat - chay: cp .env.example .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088,http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - smartcrm_network

  # ----------------------------------------------------------------------------
  # 4. Frontend React 19 / Vite build -> Nginx (proxy /api/ sang backend)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    image: smartcrm-frontend:1.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - smartcrm_network

volumes:
  postgres_data:

networks:
  smartcrm_network:
    driver: bridge
