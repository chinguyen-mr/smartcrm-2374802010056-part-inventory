name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Backend Unit & Integration Tests, Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start PostgreSQL Service
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgrespassword';"
          sudo -u postgres createdb -O postgres smart_crm || true

      - name: Create .env Configuration
        run: |
          cat << 'EOF' > .env
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=smart_crm
          DB_USER=postgres
          DB_PASSWORD=postgrespassword
          JWT_SECRET=ci-only-throwaway-jwt-secret-0123456789abcdef
          PORT=3000
          EOF
          cp .env src/backend/.env

      - name: Install Dependencies
        run: |
          cd src/backend && npm install
          cd ../frontend && npm install

      - name: Run Database Migration
        run: |
          npm run migrate

      - name: Run Database Seed (Initial & Idempotent Verification)
        run: |
          npm run seed
          npm run seed

      - name: Run Backend Tests (Unit & Integration)
        run: |
          npm test

      - name: Build Frontend Production Bundle
        run: |
          npm run build
