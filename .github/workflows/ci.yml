name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Backend Unit & Integration Tests, Frontend Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_crm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            src/backend/package-lock.json
            src/frontend/package-lock.json

      - name: Install Backend dependencies
        run: |
          cd src/backend
          npm ci

      - name: Install Frontend dependencies
        run: |
          cd src/frontend
          npm ci

      - name: Run Database Migration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: smart_crm
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
        run: |
          npm run migrate

      - name: Run Database Seed (Initial & Idempotent check)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: smart_crm
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
        run: |
          npm run seed
          npm run seed

      - name: Run Backend Tests (Unit & Integration)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: smart_crm
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
        run: |
          npm test

      - name: Build Frontend Production Bundle
        run: |
          npm run build
